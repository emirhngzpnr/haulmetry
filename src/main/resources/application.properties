spring.application.name=truckpulse

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

# Producer'in metadata veya buffer beklerken bloklanma süresi !! Dev ortam? için -> deploy sürecinde güncellenmelidir.
spring.kafka.producer.properties[max.block.ms]=5000

# Kafka iste?inin yan?t?n? bekleme süresi
spring.kafka.producer.properties[request.timeout.ms]=5000

# Mesaj?n teslim edilmesi için toplam süre s?n?r?
spring.kafka.producer.properties[delivery.timeout.ms]=15000

spring.kafka.consumer.properties.spring.json.trusted.packages=com.truckpulse.telemetry.event

spring.kafka.consumer.auto-offset-reset=earliest